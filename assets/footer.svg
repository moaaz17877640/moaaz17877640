<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="footerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#7928CA;#4F46E5;#00F2FE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#00F2FE;#7928CA;#4F46E5" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#4F46E5;#00F2FE;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Fluid Cyber Waves -->
  <path d="M0 25 C 250 65, 500 0, 750 45 C 880 70, 960 15, 1000 35 L 1000 80 L 0 80 Z" fill="url(#footerWave)" />
  <path d="M0 45 C 200 15, 450 65, 700 20 C 850 5, 950 40, 1000 25 L 1000 80 L 0 80 Z" fill="#060813" opacity="0.65" />
  
  <!-- Glowing Bottom Line -->
  <rect x="0" y="77" width="1000" height="3" fill="url(#footerGlow)" />
</svg>
