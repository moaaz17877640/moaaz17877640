<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060813" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#060813" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#7928CA;#4F46E5;#00F2FE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#00F2FE;#7928CA;#4F46E5" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#4F46E5;#00F2FE;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.08" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 42px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #00F2FE;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      .status-pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      .glow-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#00F2FE" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="160" cy="50" r="90" fill="#00F2FE" opacity="0.12" filter="url(#neonGlow)" class="glow-orb" />
  <circle cx="840" cy="190" r="110" fill="#7928CA" opacity="0.15" filter="url(#neonGlow)" class="glow-orb" />

  <!-- Ambient Cyber Waves -->
  <path d="M0 155 C 250 115, 450 205, 700 145 C 850 105, 950 175, 1000 155 L 1000 240 L 0 240 Z" fill="url(#waveGrad1)" />
  <path d="M0 185 C 200 220, 500 140, 750 190 C 880 215, 960 180, 1000 195 L 1000 240 L 0 240 Z" fill="url(#waveGrad2)" />

  <!-- Glowing Neon Top Accent -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#glowGrad)" />

  <!-- Central Elements (All strictly centered at x = 500) -->
  <!-- Status Badge with Inline Bullet -->
  <g transform="translate(500, 50)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#060813" stroke="#00F2FE" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="4" text-anchor="middle" class="status-pill-text">
      <tspan fill="#10B981">&#9679; SYSTEMS ONLINE</tspan>
      <tspan fill="#475569">&#160;&#160;|&#160;&#160;</tspan>
      <tspan fill="#00F2FE">AWS &#183; DEVOPS</tspan>
    </text>
  </g>

  <!-- Main Title -->
  <text x="500" y="120" text-anchor="middle" class="title">Moaaz Saeed Elmahi</text>

  <!-- Subtitle -->
  <text x="500" y="154" text-anchor="middle" class="subtitle">Cloud &amp; DevOps Engineer &#160;&#8226;&#160; AWS Solutions Architect</text>

  <!-- Tech Tags -->
  <text x="500" y="194" text-anchor="middle" class="badge-text">
    TERRAFORM &#160;&#8226;&#160; DOCKER &#160;&#8226;&#160; KUBERNETES &#160;&#8226;&#160; CI/CD &#160;&#8226;&#160; ANSIBLE &#160;&#8226;&#160; AZZRK &#160;&#8226;&#160; NTI
  </text>
</svg>